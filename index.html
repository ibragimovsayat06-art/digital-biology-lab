<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Biology Laboratory</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101713;
    color: #e6eee8;
    font-family: Arial, sans-serif;
}

header {
    padding: 28px 15px;
    text-align: center;
    background: #18251e;
    border-bottom: 1px solid #354b3d;
}

header h1 {
    font-size: 25px;
    letter-spacing: 2px;
    color: #a5d6b2;
}

header p { color: #9aafa0; }

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

select, button {
    background: #263b2e;
    color: white;
    border: 1px solid #526d5b;
    padding: 12px 16px;
    border-radius: 7px;
    margin: 5px;
    font-size: 15px;
}

.viewer {
    height: 480px;
    background: #050705;
    border: 1px solid #526d5b;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

.viewer img {
    max-width: 100%;
    max-height: 100%;
    pointer-events: none;
    user-select: none;
}

.controls {
    text-align: center;
    margin: 15px 0;
}

.info {
    background: #18251e;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

.info h2 { color: #a5d6b2; }

footer {
    text-align: center;
    padding: 25px;
    color: #809487;
}

@media(max-width:600px) {
    .viewer { height: 350px; }
    header h1 { font-size: 20px; }
}
</style>
</head>

<body>

<header>
<h1>DIGITAL BIOLOGY LABORATORY</h1>
<p>Virtual Microscopy & Biological Research</p>
</header>

<div class="container">

<h2>Микроскопические препараты</h2>

<select id="photo" onchange="changePhoto()">
<option value="IMG_2830.jpeg">Препарат №1</option>
<option value="IMG_2831.jpeg">Препарат №2</option>
<option value="IMG_2832.jpeg">Препарат №3</option>
</select>

<div class="viewer" id="viewer">
<img id="micro" src="IMG_2830.jpeg" alt="Микропрепарат">
</div>

<div class="controls">
<button onclick="zoom(0.25)">＋ Увеличить</button>
<button onclick="zoom(-0.25)">－ Уменьшить</button>
<button onclick="reset()">Сбросить</button>
</div>

<div class="info">
<h2>Исследование</h2>
<p>Цифровая коллекция микроскопических препаратов.</p>
<p>Выберите препарат и используйте инструменты для изучения его структуры.</p>
<p id="scale">Масштаб: 100%</p>
</div>

</div>

<footer>
DIGITAL BIOLOGY LABORATORY © 2026
</footer>

<script>
const img = document.getElementById("micro");
const viewer = document.getElementById("viewer");

let scale = 1;
let x = 0;
let y = 0;
let dragging = false;

function update() {
    img.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;

    document.getElementById("scale").textContent =
    "Масштаб: " + Math.round(scale * 100) + "%";
}

function zoom(value) {
    scale = Math.max(1, Math.min(8, scale + value));
    update();
}

function reset() {
    scale = 1;
    x = 0;
    y = 0;
    update();
}

function changePhoto() {
    img.src = document.getElementById("photo").value;
    reset();
}

let startX = 0;
let startY = 0;

viewer.addEventListener("pointerdown", e => {
    dragging = true;
    startX = e.clientX - x;
    startY = e.clientY - y;
    viewer.setPointerCapture(e.pointerId);
});

viewer.addEventListener("pointermove", e => {
    if (!dragging) return;
    x = e.clientX - startX;
    y = e.clientY - startY;
    update();
});

viewer.addEventListener("pointerup", () => dragging = false);
viewer.addEventListener("pointercancel", () => dragging = false);

update();
</script>

</body>
</html>
